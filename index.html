<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>número Secreto</title>
</head>
<body>

    <h1>Acerte o número secreto</h1>

    <h3>O número secreto está entre <span id="menor-valor">0</span> e <span id="maior-valor">100</span></h3>
    
    <form id="form-palpite">
      <label for="palpite">Seu palpite</label>
      <input id="palpite" type="number" min="1" max="100" step="1" required inputmode="numeric">
      <button id="enviar-palpite" class="btn-jogar">Enviar palpite</button>
    </form>
    <button id="ouvir" type="button" class="btn-jogar">Falar um palpite</button>
    <p id="status-voz" role="status">O microfone só será ativado ao escolher falar.</p>
    <div id="chute" class="mensagem" role="status">
    </div>

<button id="jogar-novamente" class="btn-jogar" hidden>Jogar novamente</button>
<script src="app/sortearNumero.js"></script>
<script src="app/reconhecimentoDeVoz.js"></script>
<script src="app/validacao.js"></script>
</body>
</html>
